    <!-- Relógio de parede (hora atual), sempre visível no canto -->

    <div id="app"><!-- as telas são renderizadas aqui --></div>
  </div>

  <div id="hint">OK: selecionar &nbsp;|&nbsp; Setas: navegar &nbsp;|&nbsp; Voltar: menu</div>

  <!-- Sem build. Scripts carregados em ordem; namespace global window.App -->
  <script src="js/data/mock.js"></script>

  <script src="js/input/remote.js"></script>
  <script src="js/input/pointer.js"></script>

  <script src="js/core/sound.js"></script>
  <script src="js/core/music.js"></script>
  <script src="js/core/timer.js"></script>
  <script src="js/screens/menu.js"></script>
  <script src="js/screens/playlist.js"></script>
  <script src="js/screens/music.js"></script>
  <script src="js/screens/timer.js"></script>
  <script src="js/screens/gallery.js"></script>
  <script src="js/screens/diag.js"></script>
  <script src="js/main.js"></script>

</html>
